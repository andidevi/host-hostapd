# hostapd base config for wlp3s0 (phy0) — WPA3-SAE only
# Geheimnisfrei: ssid + sae_password werden beim Start aus
# /srv/hostapd/values/ssid und /srv/hostapd/values/password ergänzt
# (siehe systemd/system/hostapd-wlp3s0.service).
# Installed by install.sh to: /srv/hostapd/wlp3s0.conf

interface=wlp3s0
driver=nl80211

# 5 GHz, 80 MHz, starting at channel 36 (36+40+44+48, center 42)
hw_mode=a
channel=36
op_class=128
ht_capab=[HT40+][SHORT-GI-40][RX-STBC1]
vht_oper_chwidth=1
vht_oper_centr_freq_seg0_idx=42
eht_oper_chwidth=1
eht_oper_centr_freq_seg0_idx=42
he_oper_chwidth=1
he_oper_centr_freq_seg0_idx=42
country_code=DE
ieee80211d=1

# Workaround hostapd-Bug: be  aus, sonst wird kein Channel gefunden weil aktuelle hostapd dann immer dfs nutzen wollen unabhägig von der regdb.
# HT/VHT-Zeilen bleiben drin.
ieee80211n=0
ieee80211ac=1
ieee80211ax=1
ieee80211be=1

wmm_enabled=1

auth_algs=1
wpa=2
wpa_key_mgmt=SAE
rsn_pairwise=CCMP
group_cipher=CCMP

# WPA3-SAE password: wird per ExecStartPre als "sae_password=<inhalt
# von /srv/hostapd/values/password>" an /run/hostapd/wlp3s0.conf angehängt.
# Klartextdatei, abgesichert durch mode 0600 (kein systemd-creds).

# WPA3 requires PMF. 2 = required.
ieee80211w=2
# Enforce SAE-only (no WPA2 fallback). Comment out for SAE-transition:
# (transition would need: wpa_key_mgmt="WPA-PSK SAE" + wpa_passphrase=...)
sae_require_mfp=1

# Hardening / sane defaults
ap_isolate=0
disassoc_low_ack=1
skip_inactivity_poll=0
max_num_sta=32
ctrl_interface=/run/hostapd
ctrl_interface_group=0
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# optimizations
he_bss_color=1
# dtim=2 is better then default, =3 is reducing even more, =4 apple devices start disconnecting -> use 2 or 3
dtim_period=3
no_ht_coex=1

# MU MIMO
he_mu_beamformer=1
he_ul_mu_mimo=1
# Fallback Encoding an 
he_er_su_disable=0
